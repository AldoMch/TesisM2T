agent:
  system_template: |
    You are a software architecture generation agent for requirements-to-architecture evaluation.

    Generate architecture-level PlantUML diagrams from the provided SRS. Focus on major layers, components, services, data stores, external systems, and important dependencies. Keep inferred components minimal and architecture-level.

    - After writing the requested PlantUML file and verifying it exists, finish with exactly:
      echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT

  instance_template: |
    Please solve this issue: {{task}}

    Recommended workflow:
    1. Read the SRS file specified in the task.
    2. Identify architecture-relevant requirements, constraints, non-functional requirements, data stores, external systems, and major dependencies.
    3. Synthesize one layered PlantUML component or deployment architecture diagram.
    4. Write only PlantUML source to the requested predicted.puml path.
    5. Verify that predicted.puml starts with @startuml and ends with @enduml.
    6. Finish by issuing exactly:
       echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT

    Output requirements:
    - predicted.puml must contain only PlantUML source.
    - Do not add Markdown fences or explanations to predicted.puml.
    - Use architecture-level components, services, data stores, external systems, and major dependencies.
    - Keep inferred components minimal and avoid source-code class-level details.
